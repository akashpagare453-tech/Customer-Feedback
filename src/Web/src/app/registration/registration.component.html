<div class="registration-container">
    <div class="registration-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join Feedback Loop Today</p>

        <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" formControlName="name" class="form-control"
                    [ngClass]="{ 'is-invalid': registrationForm.get('name')?.touched && registrationForm.get('name')?.invalid }">
                <div class="invalid-feedback"
                    *ngIf="registrationForm.get('name')?.touched && registrationForm.get('name')?.invalid">
                    Name is required
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" formControlName="email" class="form-control"
                    [ngClass]="{ 'is-invalid': registrationForm.get('email')?.touched && registrationForm.get('email')?.invalid }">
                <div class="invalid-feedback"
                    *ngIf="registrationForm.get('email')?.touched && registrationForm.get('email')?.errors?.['required']">
                    Email is required
                </div>
                <div class="invalid-feedback"
                    *ngIf="registrationForm.get('email')?.touched && registrationForm.get('email')?.errors?.['email']">
                    Please enter a valid email
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" formControlName="password" class="form-control"
                    [ngClass]="{ 'is-invalid': registrationForm.get('password')?.touched && registrationForm.get('password')?.invalid }">
                <div class="invalid-feedback"
                    *ngIf="registrationForm.get('password')?.touched && registrationForm.get('password')?.errors?.['required']">
                    Password is required
                </div>
                <div class="invalid-feedback"
                    *ngIf="registrationForm.get('password')?.touched && registrationForm.get('password')?.errors?.['minlength']">
                    Password must be at least 6 characters
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" formControlName="confirmPassword" class="form-control"
                    [ngClass]="{ 'is-invalid': registrationForm.get('confirmPassword')?.touched && (registrationForm.get('confirmPassword')?.invalid || registrationForm.hasError('mismatch')) }">
                <div class="invalid-feedback"
                    *ngIf="registrationForm.get('confirmPassword')?.touched && registrationForm.hasError('mismatch')">
                    Passwords do not match
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" [disabled]="registrationForm.invalid || loading" class="btn-primary">
                    {{ loading ? 'Creating Account...' : 'Sign Up' }}
                </button>
            </div>

            <div class="login-link">
                Already have an account? <a routerLink="/login">Log in</a>
            </div>
        </form>
    </div>
</div>
