<div class="feedback-wrapper">
    <div class="container">
        <div class="card feedback-card">
            <div class="feedback-header">
                <h2>We Value Your Feedback</h2>
                <p>Help us improve your experience by sharing your thoughts.</p>
            </div>

            <div *ngIf="successMessage" class="alert success">
                {{ successMessage }}
            </div>

            <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">
                <div class="form-row">
                    <div class="form-group half">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" formControlName="name" placeholder="John Doe"
                            [class.error]="feedbackForm.get('name')?.invalid && feedbackForm.get('name')?.touched">
                        <div *ngIf="feedbackForm.get('name')?.invalid && feedbackForm.get('name')?.touched"
                            class="error-msg">
                            Name is required.
                        </div>
                    </div>

                    <div class="form-group half">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" formControlName="email" placeholder="john@example.com"
                            [class.error]="feedbackForm.get('email')?.invalid && feedbackForm.get('email')?.touched">
                        <div *ngIf="feedbackForm.get('email')?.invalid && feedbackForm.get('email')?.touched"
                            class="error-msg">
                            Valid email is required.
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="category">Feedback Category</label>
                    <select id="category" formControlName="category">
                        <option value="suggestion">Suggestion</option>
                        <option value="bug">Report a Bug</option>
                        <option value="compliment">Compliment</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Rating</label>
                    <div class="rating-group">
                        <label *ngFor="let star of [1,2,3,4,5]" class="rating-label">
                            <input type="radio" formControlName="rating" [value]="star">
                            <span class="star-icon">{{ star }} ★</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" formControlName="message" rows="5" placeholder="Tell us what you think..."
                        [class.error]="feedbackForm.get('message')?.invalid && feedbackForm.get('message')?.touched"></textarea>
                    <div *ngIf="feedbackForm.get('message')?.invalid && feedbackForm.get('message')?.touched"
                        class="error-msg">
                        Message must be at least 10 characters.
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" [disabled]="isSubmitting || feedbackForm.invalid">
                        <span *ngIf="!isSubmitting">Submit Feedback</span>
                        <span *ngIf="isSubmitting" class="spinner"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
